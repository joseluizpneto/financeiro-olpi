{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-wallet2 text-primary" style="font-size:2.5rem"></i>
      <h1 class="h4 fw-bold mt-2">Controle Financeiro</h1>
    </div>
    <div class="card"><div class="card-body p-4">
      {% if bloqueio_msg %}
        <div class="alert alert-danger py-2">{{ bloqueio_msg }}</div>
      {% elif form.errors %}
        <div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>
      {% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label" for="id_username">Usuário</label><input class="form-control" type="text" name="username" id="id_username" autofocus autocapitalize="none" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Senha</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
{% block fab %}{% endblock %}
