{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="row justify-content-center"><div class="col-lg-5">
  <div class="page-head"><h1>Trocar senha</h1></div>
  <div class="card"><div class="card-body">
    <form method="post">{% csrf_token %}
      {% for campo in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        <input class="form-control" type="password" name="{{ campo.html_name }}" id="{{ campo.id_for_label }}" autocomplete="{% if 'old' in campo.html_name %}current-password{% else %}new-password{% endif %}" required>
        {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
        {% for e in campo.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button class="btn btn-primary">Salvar nova senha</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
