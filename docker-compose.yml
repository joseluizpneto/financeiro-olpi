name: financas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "max_connections=30"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financas}
      POSTGRES_USER: ${POSTGRES_USER:-financas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Araguaina}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.75"
          pids: 100
        reservations:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-}
        APP_GIT_BRANCH: ${APP_GIT_BRANCH:-main}
        APP_GIT_DATE: ${APP_GIT_DATE:-}
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      LOGIN_MAX_TENTATIVAS: ${LOGIN_MAX_TENTATIVAS:-5}
      LOGIN_BLOQUEIO_MINUTOS: ${LOGIN_BLOQUEIO_MINUTOS:-15}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-1209600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/Araguaina}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-financas}
      POSTGRES_USER: ${POSTGRES_USER:-financas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SEED_TITULARES: ${SEED_TITULARES:-}
      SEED_EMPRESA_NOME: ${SEED_EMPRESA_NOME:-}
      SEED_EMPRESA_DESCRICAO: ${SEED_EMPRESA_DESCRICAO:-}
      GIT_UPDATE_REPO: ${GIT_UPDATE_REPO:-}
      GIT_UPDATE_BRANCH: ${GIT_UPDATE_BRANCH:-main}
      GIT_UPDATE_TOKEN: ${GIT_UPDATE_TOKEN:-}
      GIT_UPDATE_DIR: /app/atualizacao
    volumes:
      - media_data:/app/media
      - app_data:/app/data
      - ./data/atualizacao:/app/atualizacao
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTA:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "1.0"
          pids: 100
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Perfil opcional HTTPS via Caddy (vinculado a 127.0.0.1 por padrão).
  # Com Cloudflare Tunnel, não é necessário ativar este perfil.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-80}:80"
      - "127.0.0.1:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
          pids: 64
        reservations:
          memory: 24M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true
  frontend:
    driver: bridge

volumes:
  pgdata:
  media_data:
  app_data:
  caddy_data:
  caddy_config:
